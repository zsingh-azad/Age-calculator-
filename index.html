<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Age Calculator | Azad Singh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="tag">LIVE AGE CALCULATOR</p>
      <h1>How old are you?</h1>
      <p class="subtitle">Enter your date of birth and see your exact age update every second.</p>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">

      <button id="calculateBtn">Calculate Age</button>

      <p id="error" class="error"></p>

      <div id="result" class="result hidden">
        <div class="age-main">
          <span id="years">0</span>
          <small>Years</small>
        </div>

        <div class="time-grid">
          <div class="time-box"><strong id="months">0</strong><span>Months</span></div>
          <div class="time-box"><strong id="days">0</strong><span>Days</span></div>
          <div class="time-box"><strong id="hours">0</strong><span>Hours</span></div>
          <div class="time-box"><strong id="minutes">0</strong><span>Minutes</span></div>
          <div class="time-box"><strong id="seconds">0</strong><span>Seconds</span></div>
        </div>
      </div>

      <footer>Built by <strong>Azad Singh</strong> • HTML, CSS &amp; JavaScript</footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
